<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הפרויקט שלי</title>
    <style>
        /* עיצוב כללי ונקי לעמוד */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #2d3748;
            line-height: 1.7;
            max-width: 850px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        /* כותרת ראשית */
        h1 {
            color: #1a202c;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        /* עיצוב כרטיס תוכן אלגנטי */
        .content-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
            margin-top: 25px;
            border: 1px solid #e2e8f0;
        }

        /* עיצוב כותרות משנה וקו תחתון נקי */
        h2 {
            font-size: 1.3rem;
            color: #2b6cb0;
            margin-top: 0;
        }

        u {
            text-decoration: underline;
            font-weight: normal;
        }

        /* עיצוב שמות מדעיים בנטוי */
        em {
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>ברוכים הבאים לפרויקט שלי</h1>
    <p>סקירה של מחקר אקדמי והישגים מרכזיים.</p>

    <div class="content-card">
        <h2><u>Research Experience</u></h2>
        <p><strong>Undergraduate Research — Tel Aviv University:</strong> investigating the MazEF toxin–antitoxin system in <em>Bacillus subtilis</em> and the conservation of this system using MazEF from <em>listeria</em>.</p>
    </div>

</body>
</html>
